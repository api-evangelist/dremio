aid: dremio
name: Dremio
description: >-
  Dremio is a data lakehouse platform for running high-performance SQL queries
  directly on cloud object storage and data lakes without moving or copying data.
  It combines an Apache Arrow-based MPP query engine, Autonomous Reflections for
  acceleration, and an Apache Iceberg / Apache Polaris-powered Open Catalog into a
  self-service semantic layer for analytics and agentic AI. Dremio is delivered as
  a fully managed service (Dremio Cloud) and a self-managed deployment (Dremio
  Enterprise), and exposes a REST API, Apache Arrow Flight SQL, Arrow Flight SQL
  JDBC/ODBC drivers, a developer CLI, a dbt adapter, and an official Model Context
  Protocol (MCP) server for connecting AI agents to the lakehouse.
